<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monte Carlo Sprint Sim</title>
    <meta name="description" content="Will the team make it? Delivery odds from the sprints you've already done." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div class="wrap">
      <header class="top" id="toolbar"></header>

      <div class="grid">
        <div class="col">
          <section class="panel" id="history"></section>
          <section class="panel" id="targets"></section>
        </div>

        <div class="col">
          <section class="panel answer" id="odds"></section>

          <div class="details" id="details" hidden>
            <div class="tiles" id="tiles"></div>

            <section class="panel">
              <div class="panel-h"><h2>Outcomes by confidence</h2><span class="hint">What the replays delivered by the target date</span></div>
              <div class="panel-b scroll-x"><table class="dist" id="distribution"></table></div>
            </section>

            <section class="panel">
              <div class="panel-h"><h2>Where the replays landed</h2><span class="hint">Hover a bar for its range</span></div>
              <div class="panel-b charts" id="charts"></div>
            </section>

            <section class="panel">
              <div class="panel-h"><h2>Reading the two measures</h2></div>
              <div class="panel-b read" id="rules"></div>
            </section>
          </div>

          <section id="learn"></section>
        </div>
      </div>

      <footer class="foot">
        <img class="foot-logo" src="/d2d-logo.svg" alt="Digital2DNA" width="110" height="40" />
        <p>We deliver working software for organizations where complexity is the reality and progress can't wait.</p>
        <p class="hint">
          &copy; 2026 Digital2DNA &middot;
          <a class="social" href="https://linkedin.com/company/digital2dna" target="_blank" rel="noopener noreferrer" aria-label="Digital2DNA on LinkedIn">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.35V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/>
            </svg>
          </a>
        </p>
      </footer>
    </div>
    <button id="rollFloat" class="btn primary float" type="button" hidden>Roll again</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
