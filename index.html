<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monte Carlo Sprint Sim</title>
    <meta name="description" content="Forecast sprint delivery odds — velocity and flow — from your sprint history." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div class="wrap">
      <header class="top" id="toolbar"></header>

      <div class="grid">
        <div class="col">
          <section class="panel" id="history"></section>
          <section class="panel" id="targets"></section>
        </div>

        <div class="col">
          <div class="tiles" id="tiles"></div>

          <section class="panel">
            <div class="panel-h">
              <h2>Distribution outcomes</h2>
              <span class="hint">What the simulated sprints deliver by the target date</span>
            </div>
            <div class="panel-b scroll-x"><table class="dist" id="distribution"></table></div>
          </section>

          <section class="panel">
            <div class="panel-h">
              <h2>Where the trials landed</h2>
              <span class="hint">Hover a bar for its range</span>
            </div>
            <div class="panel-b charts" id="charts"></div>
          </section>

          <section class="panel">
            <div class="panel-h"><h2>Reading the two numbers together</h2></div>
            <div class="panel-b read" id="reading"></div>
          </section>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
